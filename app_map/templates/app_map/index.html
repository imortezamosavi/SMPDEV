<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Soil Moisture Monitoring Platform</title>

    {% load static %}

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<header class="site-header">

    <div class="brand">

        <div class="brand-text">

            <h1>
                <i class="bi bi-droplet-half"></i>
                Soil Moisture Monitoring Platform
            </h1>

            <p>
                Satellite-based Soil Moisture Monitoring for Smarter Agricultural &
                Environmental Decision Making
            </p>

        </div>

    </div>

</header>


<main class="app-layout">


    <div class="form-container">

        <label for="dateInput">
            <i class="bi bi-calendar3"></i>
            Observation Date
        </label>

        <input
            type="date"
            id="dateInput"
        >


        <button id="saveBtn">

            <i class="bi bi-map"></i>

            Generate Map

        </button>

    </div>


    <div id="map"></div>


</main>

<input
    type="hidden"
    id="csrfToken"
    value="{{ csrf_token }}"
>

<script src="https://cdn.jsdelivr.net/npm/ol@10.6.1/dist/ol.js"></script>

<script src="{% static 'js/main.js' %}"></script>

</body>
</html>
